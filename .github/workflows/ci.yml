name: CI

on:
  # Every branch, so feature work is checked before it reaches main.
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint --format ./.github/eslint-formatter.mjs

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
