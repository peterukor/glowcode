<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6d3fd6" />
    <title>Glowcode · Watch your Python come alive</title>
    <meta
      name="description"
      content="A visual Python playground for beginners. Write small programs and watch variables, decisions and loops animate step by step."
    />
    <meta property="og:site_name" content="Glowcode" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/glowcode-wordmark.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/brand/glowcode-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
